[package]
name = "calm-rust"
version = "0.1.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
rxing = { version = "0.9.2", default-features = false, features = ["encoding_rs", "decoders", "encoders", "qrcode", "oned", "aztec", "datamatrix", "pdf417"] }
# Image Upload: gallery photos decode straight to luma (still.rs). JPEG (the
# Kompakt camera) and PNG (screenshots) cover the gallery; anything else goes
# through Android's decoders.
zune-jpeg = "0.5.15"
zune-core = "0.5.3"
png = "0.18.1"

[dev-dependencies]
jpeg-encoder = "0.6"

# Size-focused release build. opt-level stays 3 so the per-frame decode loop
# keeps full speed on the Kompakt's slow SoC; LTO + 1 codegen unit + no unwind
# tables do the shrinking (and LTO usually helps speed too).
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
